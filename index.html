<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nimbus Hydration Reminder</title>
<style>
body{margin:0;overflow:hidden;background:transparent;font-family:"Segoe UI",sans-serif;}#cloud{position:fixed;left:-300px;top:180px;width:260px;z-index:9999;}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}}.floating{animation:float 2s ease-in-out infinite}#bubble{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:white;border-radius:25px;padding:15px 30px;border:3px solid #7dd3fc;box-shadow:0 5px 15px rgba(0,0,0,.15);font-size:28px;font-weight:600;opacity:0;transition:.5s}#bubble.show{opacity:1}.sparkle{position:fixed;font-size:24px;pointer-events:none;animation:sparkle 2s linear forwards}@keyframes sparkle{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}.rain{position:fixed;font-size:20px;pointer-events:none;animation:rainFall 2s linear forwards}@keyframes rainFall{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(180px)}}#ripple{position:fixed;width:140px;height:40px;border-radius:50%;border:3px solid #7dd3fc;opacity:0}.rippleShow{animation:ripple 1.5s infinite}@keyframes ripple{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(2)}}
</style></head><body><div id="bubble">☁️💧 Suji, Drink Water!</div><div id="ripple"></div><div id="cloud"><svg viewBox="0 0 256 200"><defs><linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#DDEFFF"/></linearGradient></defs><ellipse cx="128" cy="120" rx="65" ry="38" fill="url(#cloudGrad)"/><circle cx="90" cy="120" r="35" fill="url(#cloudGrad)"/><circle cx="128" cy="95" r="42" fill="url(#cloudGrad)"/><circle cx="170" cy="118" r="30" fill="url(#cloudGrad)"/><circle cx="110" cy="115" r="5"/><circle cx="145" cy="115" r="5"/><path d="M110 140 Q128 152 146 140" stroke="#4A90E2" stroke-width="4" fill="none"/></svg></div><script>const cloud=document.getElementById('cloud'),bubble=document.getElementById('bubble'),ripple=document.getElementById('ripple');function speakReminder(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const s=new SpeechSynthesisUtterance('Suji, Drink Water');s.rate=.95;s.pitch=1.2;speechSynthesis.speak(s)}function createSparkles(){for(let i=0;i<15;i++){const e=document.createElement('div');e.className='sparkle';e.innerHTML='✨';e.style.left=(cloud.offsetLeft+Math.random()*220)+'px';e.style.top=(cloud.offsetTop+Math.random()*100)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}}function createRain(){for(let i=0;i<20;i++){const d=document.createElement('div');d.className='rain';d.innerHTML='💧';d.style.left=(cloud.offsetLeft+Math.random()*180)+'px';d.style.top=(cloud.offsetTop+100)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}}function moveCloudIn(){cloud.classList.add('floating');let pos=-300;const stop=window.innerWidth*.35;const m=setInterval(()=>{pos+=8;cloud.style.left=pos+'px';ripple.style.left=(pos+60)+'px';ripple.style.top='320px';if(pos>=stop){clearInterval(m);activateReminder()}},30)}function activateReminder(){bubble.classList.add('show');ripple.classList.add('rippleShow');createSparkles();createRain();speakReminder();setTimeout(()=>{bubble.classList.remove('show');ripple.classList.remove('rippleShow');moveCloudOut()},7000)}function moveCloudOut(){let pos=parseInt(cloud.style.left);const m=setInterval(()=>{pos+=10;cloud.style.left=pos+'px';if(pos>window.innerWidth+400){clearInterval(m);cloud.classList.remove('floating')}},30)}function startReminder(){moveCloudIn()}setTimeout(startReminder,1000);setInterval(startReminder,60*60*1000);</script></body></html>
